name: Build iOS and Android pilot (uploads to TestFlight and Play internal testing only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digital-record-pilot-build
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check Expo connection
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing repository Actions secret EXPO_TOKEN. Add an Expo access token in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:regressions
      - name: Refuse anything but internal testing
        run: |
          node -e "const e=require('./eas.json');const a=e.submit.pilot.android;if(a.track!=='internal')throw Error('pilot submit track must be internal, got '+a.track);if(!e.submit.pilot.ios.ascAppId)throw Error('missing ascAppId');console.log('pilot uploads: Play',a.track,'+ TestFlight',e.submit.pilot.ios.ascAppId)"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 24.12.0
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Build signed store binary
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        # Uploads with the "pilot" submit profile: TestFlight, and the Google Play internal track only.
        run: |
          eas build --platform "$BUILD_PLATFORM" --profile pilot --auto-submit-with-profile pilot \
            --what-to-test "قراءة الفواتير بالدعوة: فواتير وهمية فقط بلا بيانات شخصية. Invoice reading pilot: fictional invoices only." \
            --non-interactive --wait --json > build-result.json
      - name: Save build result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-result-${{ matrix.platform }}
          path: build-result.json
          if-no-files-found: ignore
