name: Build iOS and Android pilot

on:
  push:
    branches: [codex/invoice-reader-pilot]
    paths: [.github/workflows/build-pilot.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digital-record-pilot-build
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check Expo connection
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing repository Actions secret EXPO_TOKEN. Add an Expo access token in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run typecheck
      - run: npm run reader:test

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm install --no-package-lock
      - name: Build signed store binary
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: eas build --platform "$BUILD_PLATFORM" --profile production --non-interactive --wait --json > build-result.json
      - name: Save build result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-result-${{ matrix.platform }}
          path: build-result.json
          if-no-files-found: ignore
