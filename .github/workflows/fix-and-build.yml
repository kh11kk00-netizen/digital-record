name: EAS Build (Store)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [android, ios, all]
        default: all
      submit:
        description: Upload to TestFlight or Google Play internal draft after building
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:regressions
      - name: Build and optionally upload
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_PLATFORM: ${{ inputs.platform }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          flags=()
          if [ "$SUBMIT" = "true" ]; then flags+=(--auto-submit); fi
          eas build --platform "$BUILD_PLATFORM" --profile production --non-interactive --wait "${flags[@]}"
