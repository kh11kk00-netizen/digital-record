# Invoice reader on Fly.io: one small machine with a volume for usage counters (SQLite).
# Secrets are set with `fly secrets set`, never in this file: GEMINI_API_KEY, OCR_INVITE_CODE.
app = "digital-record-reader"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  OCR_CLIENT_IP_HEADER = "fly-client-ip"
  # Pilot: 20 testers x 20 reads/month; spend ceilings in USD (1 USD = 3.75 SAR).
  OCR_PLANS = '{"free":{"monthlyReads":20},"paid":{"monthlyReads":200}}'
  OCR_DAILY_READS = "100"
  OCR_DAILY_BUDGET_USD = "0.5"
  OCR_MONTHLY_BUDGET_USD = "4"
  OCR_DAILY_REGISTRATIONS = "30"

[mounts]
  source = "reader_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    path = "/health"
    interval = "60s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
